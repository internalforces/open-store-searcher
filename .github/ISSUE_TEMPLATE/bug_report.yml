name: Bug report
description: Report reproducible incorrect behavior without personal or sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal information, real user search terms, or vulnerability details. Follow SECURITY.md for security reports.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened? Use synthetic or redacted examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest safe steps, branch or commit, and commands.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, or hosted URL as applicable.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, and real user search terms.
          required: true
        - label: This report does not contain vulnerability details.
          required: true
