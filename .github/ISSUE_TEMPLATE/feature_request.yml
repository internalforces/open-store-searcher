name: Feature request
description: Propose a change that preserves the project's safety and zero-cost boundaries.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior and its evidence or uncertainty boundary.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Effects on project constraints
      description: Address privacy, static hosting, zero cost, accessibility, source terms, and last-known-good behavior.
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: This request contains no secrets, personal data, or real user search terms.
          required: true
