name: Prepare approved initial Pages import
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Exact active retained source ID reviewed on current main
        required: true
        type: string
permissions: {}
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      run_binding: ${{ steps.binding.outputs.run_binding }}
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact-id }}
      candidate_service_digest: ${{ steps.candidate.outputs.artifact-digest }}
      metadata_artifact_id: ${{ steps.metadata.outputs.artifact-id }}
      tar_sha256: ${{ steps.binding.outputs.tar_sha256 }}
      inventory_sha256: ${{ steps.binding.outputs.inventory_sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npx --no-install playwright install --with-deps
      - run: npm run verify:full
      - name: Verify publication operators and packaging
        run: node --test scripts/check-pages-artifact.test.mjs scripts/check-publication-state.test.mjs scripts/check-publication-workflows.test.mjs scripts/publication-operators.test.mjs scripts/initial-import-operators.test.mjs
      - name: Prepare the exact active retained source
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SOURCE_ID: ${{ inputs.source_id }}
        run: node scripts/stage-initial-import.mjs publication/config.json publication/initial-import-approvals.json "$SOURCE_ID" "$RUNNER_TEMP/initial-prepared"
      - name: Reject an obsolete source revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_sha" = "$EXPECTED_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: candidate
        with:
          name: github-pages
          path: ${{ runner.temp }}/initial-prepared/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Bind this run after rehashing the uploaded raw tar
        id: binding
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
        run: node scripts/bind-initial-import-run.mjs "$RUNNER_TEMP/initial-prepared" "$CANDIDATE_ARTIFACT_ID" "$RUNNER_TEMP/initial-metadata"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: metadata
        with:
          name: initial-import-metadata
          path: ${{ runner.temp }}/initial-metadata/
          retention-days: 1
          if-no-files-found: error
      - name: Expose exact candidate and metadata for human review
        env:
          RUN_BINDING: ${{ steps.binding.outputs.run_binding }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_SERVICE_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
          METADATA_ARTIFACT_ID: ${{ steps.metadata.outputs.artifact-id }}
        run: |
          printf '%s\n' "Candidate artifact ID: $CANDIDATE_ARTIFACT_ID" "Upload service digest (wrapper archive): $CANDIDATE_SERVICE_DIGEST" "Metadata artifact ID: $METADATA_ARTIFACT_ID" "Raw tar and inventory binding: $RUN_BINDING" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PAGES_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject obsolete code after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          test "$current_sha" = "$EXPECTED_SHA"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
      - name: Recheck the trusted same-run preparation after environment approval
        env:
          RUN_BINDING: ${{ needs.prepare.outputs.run_binding }}
        run: node scripts/check-initial-import-run.mjs "$RUN_BINDING"
      - name: Require the public descriptor to remain absent after environment approval
        run: node scripts/check-publication-state.mjs https://internalforces.github.io/open-store-searcher/release.json 404 absent
      - name: Publish the verified unchanged artifact from this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages
